<!doctype html>
<html lang="th" data-build="34.29.51-STOCK-STRUCTURE-EDIT-DELETE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#004c39" />
  <title>Reset Cache - CHEE CHAN STOCK</title>
  <style>
    :root{--green:#004c39;--gold:#d9b567;--cream:#f7f1e5;--ink:#14342c;}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#003f31,#f7f1e5 42%);color:var(--ink);display:grid;place-items:center;padding:24px;}
    .card{width:min(560px,100%);background:rgba(255,255,255,.96);border:1px solid rgba(217,181,103,.45);border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.18);padding:28px 24px;text-align:center;}
    .logo{width:82px;height:82px;object-fit:contain;margin:0 auto 12px;display:block}h1{font-size:30px;line-height:1.2;margin:6px 0 8px;color:#062d24}p{font-size:17px;line-height:1.6;color:#5d615e;margin:10px 0}
    .status{margin:18px 0;padding:16px;border-radius:18px;background:#eefaf4;border:1px solid #bdebd0;color:#065f46;font-weight:800;text-align:left;white-space:pre-wrap}
    .btn{appearance:none;border:0;border-radius:18px;background:linear-gradient(135deg,#007a5a,#004c39);color:white;font-size:18px;font-weight:900;padding:15px 18px;width:100%;min-height:56px;box-shadow:0 8px 18px rgba(0,76,57,.22);}
    .btn.secondary{margin-top:10px;background:#e9f3ee;color:#004c39;box-shadow:none}.small{font-size:13px;color:#76827c}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="chee-chan-logo.png?v=34.29.51-r2" alt="CHEE CHAN STOCK" />
    <h1>ล้าง Cache ระบบ</h1>
    <p>ใช้หน้านี้เมื่อเว็บค้างหน้าโหลด หรือยังติดเวอร์ชันเก่าหลัง Deploy</p>
    <div id="status" class="status">กำลังเตรียมล้าง Service Worker และ Cache...</div>
    <button id="runBtn" class="btn" type="button">ล้าง Cache อีกครั้ง</button>
    <button id="homeBtn" class="btn secondary" type="button">กลับเข้าเว็บ</button>
    <p class="small">CHEE CHAN STOCK MAIN v34.29.51 STOCK-STRUCTURE-EDIT-DELETE</p>
  </main>
  <script>
    const statusEl=document.getElementById('status');
    function log(msg){ statusEl.textContent += '\n' + msg; }
    async function resetCache(){
      statusEl.textContent='เริ่มล้างข้อมูล cache...';
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          log('พบ Service Worker: '+regs.length+' ตัว');
          await Promise.all(regs.map(r=>r.unregister()));
          log('ยกเลิก Service Worker เก่าแล้ว');
        }else{ log('อุปกรณ์นี้ไม่มี Service Worker'); }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>/theview-stock|chee-chan|workbox/i.test(k)).map(k=>caches.delete(k)));
          log('ลบ Cache แล้ว');
        }else{ log('อุปกรณ์นี้ไม่มี Cache Storage'); }
        try{
          if('indexedDB' in window){
            await new Promise(resolve=>{
              const req=indexedDB.deleteDatabase('theview-stock-cache-v3-theview-4d389');
              req.onsuccess=req.onerror=req.onblocked=()=>resolve();
            });
            log('ล้าง Product cache ในเครื่องแล้ว');
          }
        }catch(e){ log('ข้าม Product cache: '+(e?.message||e)); }
        try{
          Object.keys(localStorage).forEach(k=>{ if(/build|cache|version|branding|lastRoute|reportRange|serviceWorker/i.test(k)) localStorage.removeItem(k); });
          sessionStorage.clear();
          log('ล้างค่าค้างในเครื่องบางส่วนแล้ว');
        }catch(e){ log('ข้าม local/session storage: '+(e?.message||e)); }
        log('เสร็จแล้ว กำลังกลับเข้าเว็บเวอร์ชันใหม่...');
        setTimeout(()=>{ location.replace('/?v=3429512&reset=done&t='+Date.now()); },900);
      }catch(e){ log('เกิดข้อผิดพลาด: '+(e?.message||e)); }
    }
    document.getElementById('runBtn').addEventListener('click', resetCache);
    document.getElementById('homeBtn').addEventListener('click', ()=>location.href='/?v=3429512&t='+Date.now());
    resetCache();
  </script>
</body>
</html>
